# ==============================================================================
# Workflow: Release Please
# 
# WHEN IT TRIGGERS: Every time code is pushed or merged into the `master` branch.
# 
# WHAT IT DOES: 
#   - Scans commit messages (Conventional Commits) to determine version bumps.
#   - Automatically opens/updates a "Release PR" containing changelogs.
#   - If a Release PR is merged, it publishes the GitHub Release (for HACS) and 
#     publishes `kospel-cmi-lib` to PyPI.
# 
# WHY IT EXISTS: It completely automates semantic versioning, changelog generation, 
# and package deployment for the monorepo.
# 
# WHERE IT SITS IN WORKFLOW: Final Deployment / Release Publishing phase.
# ==============================================================================
name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      lib--release_created: ${{ steps.release.outputs.lib--release_created }}
      lib--tag_name: ${{ steps.release.outputs.lib--tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Append buycoffee footer to GitHub Release
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            BODY=$(gh release view "$TAG" --json body --jq '.body')
            FOOTER=$'\n\n---\n☕ **Enjoying this integration?**\nI maintain this open-source integration in my private time. If you\'d like to say thanks with a coffee:\n\n[![Buy me a coffee](https://img.shields.io/badge/Kup%20mi%20kaw%C4%99-buycoffee.to-ffdd00.svg?style=for-the-badge&logo=buy-me-a-coffee&logoColor=black)](https://buycoffee.to/jankrl)\n\n*GitHub issues can be created in either Polish or English.*'
            gh release edit "$TAG" --notes "${BODY}${FOOTER}"
          fi

  check-lib-release:
    name: Check if kospel-cmi-lib was released
    runs-on: ubuntu-latest
    outputs:
      lib_bumped: ${{ steps.check.outputs.lib_bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"chore: release"* ]] || [[ "$COMMIT_MSG" == *"chore(master): release"* ]]; then
            if git diff --name-only HEAD^ HEAD | grep -q "^lib/pyproject\.toml$"; then
              echo "lib_bumped=true" >> "$GITHUB_OUTPUT"
            else
              echo "lib_bumped=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "lib_bumped=false" >> "$GITHUB_OUTPUT"
          fi

  publish-lib:
    name: Publish kospel-cmi-lib to PyPI
    needs: [release-please, check-lib-release]
    if: ${{ needs.check-lib-release.outputs.lib_bumped == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher authentication
      contents: write  # Required to push the git tag
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Build kospel-cmi-lib
        run: uv build --package kospel-cmi-lib --out-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create and push Git tag
        run: |
          VERSION=$(grep -oP '(?<=^version = ")[^"]+' lib/pyproject.toml)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "lib-v$VERSION" >/dev/null 2>&1; then
            git tag "lib-v$VERSION"
            git push origin "lib-v$VERSION"
          fi
