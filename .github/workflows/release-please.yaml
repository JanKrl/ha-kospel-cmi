name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      lib--release_created: ${{ steps.release.outputs.lib--release_created }}
      lib--tag_name: ${{ steps.release.outputs.lib--tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  check-lib-release:
    name: Check if kospel-cmi-lib was released
    runs-on: ubuntu-latest
    outputs:
      lib_bumped: ${{ steps.check.outputs.lib_bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"chore: release"* ]] || [[ "${{ github.event.head_commit.message }}" == *"chore(master): release"* ]]; then
            if git diff --name-only HEAD^ HEAD | grep -q "^lib/pyproject\.toml$"; then
              echo "lib_bumped=true" >> "$GITHUB_OUTPUT"
            else
              echo "lib_bumped=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "lib_bumped=false" >> "$GITHUB_OUTPUT"
          fi

  publish-lib:
    name: Publish kospel-cmi-lib to PyPI
    needs: [release-please, check-lib-release]
    if: ${{ needs.check-lib-release.outputs.lib_bumped == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher authentication
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build kospel-cmi-lib
        run: uv build --package kospel-cmi-lib --out-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
